<!DOCTYPE html>
<html>
<head>
    <title>Upgrade to Premium</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
</head>

<body>

<h1 style = "font-size: 100px ;text-align: center; ">Unlock Premium</h1>

<p style = "font-size: 80px ;text-align: center; ">Get access to all premium content.</p>

<h2 style = "font-size: 60px ;text-align: center; ">$8.05 / month</h2>

<script type="module" src="subscribe.js"></script>
<div style="display: flex; justify-content: center; width: 100%; ">    
    <div id="paypal-button-container-P-50T11181GL9006104NJ46XOA" style="width: 100%; max-width: 280px; min-height: 70px;"></div>
</div>    
<script src="https://www.paypal.com/sdk/js?client-id=BAAX1xss_RaT5QFasjzajfIhzjLVkqMvaai3MpJCbYDQLJmoGvQ66pldSV8BGz1RwaIgU07-6r9R2TaU94&vault=true&intent=subscription" data-sdk-integration-source="button-factory"></script>
<script>
  paypal.Buttons({
      style: {
          shape: 'rect',
          color: 'gold',
          layout: 'vertical',
          label: 'subscribe'
      },
      createSubscription: function(data, actions) {
        return actions.subscription.create({
          /* Creates the subscription */
          plan_id: 'P-50T11181GL9006104NJ46XOA'
        });
      },
      onApprove: async function(data, actions) {
    const supabase = window.supabaseClient;

    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
        alert("Please log in before subscribing.");
        return;
    }

    const response = await fetch(
        "https://heolqzakdwsvlhhrtdjn.supabase.co/functions/v1/paypal-verify",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${session.access_token}`
            },
            body: JSON.stringify({
                subscriptionID: data.subscriptionID
            })
        }
    );

    const result = await response.json();

    if (!response.ok) {
        console.error(result);
        alert("The subscription could not be verified.");
        return;
    }

    alert("Subscription activated! Premium access granted.");
    window.location.href = "premium.html";
}
  }).render('#paypal-button-container-P-50T11181GL9006104NJ46XOA'); // Renders the PayPal button
</script>
</body>
</html>
